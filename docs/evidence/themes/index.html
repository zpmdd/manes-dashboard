<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大屏配色验收截图</title><style>body{margin:24px;background:#171a20;color:#eceff4;font:14px system-ui}header{display:flex;align-items:center;gap:24px;margin-bottom:18px}h1{font-size:20px;margin:0}select{font:inherit;padding:8px;background:#29313d;color:inherit;border:1px solid #596777;border-radius:6px}main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}figure{margin:0}figcaption{margin:0 0 8px}img{display:block;width:100%;border-radius:8px}a{color:inherit}p{color:#bcc7d6}@media(max-width:700px){main{grid-template-columns:1fr}header{flex-wrap:wrap}}</style><header><h1>8 套配色 · 实际浏览器截图</h1><label>场景 <select id="view"><option value="overview">全国总览</option><option value="district">区县下钻</option><option value="roadmap">浅色道路底图</option><option value="basic">12 类基础组件</option><option value="professional">8 类专业图表</option></select></label></header><p>点击截图查看 1920 × 1080 原图；第一套为保留的项目默认配色。</p><main><figure data-id="champagne"><figcaption>烟灰香槟 · 默认</figcaption><a href="champagne-overview.jpg"><img src="champagne-overview.jpg" alt="烟灰香槟 · 默认"></a></figure><figure data-id="nord"><figcaption>北境冰蓝</figcaption><a href="nord-overview.jpg"><img src="nord-overview.jpg" alt="北境冰蓝"></a></figure><figure data-id="ocean"><figcaption>深海青碧</figcaption><a href="ocean-overview.jpg"><img src="ocean-overview.jpg" alt="深海青碧"></a></figure><figure data-id="forest"><figcaption>森林琥珀</figcaption><a href="forest-overview.jpg"><img src="forest-overview.jpg" alt="森林琥珀"></a></figure><figure data-id="iris"><figcaption>午夜鸢尾</figcaption><a href="iris-overview.jpg"><img src="iris-overview.jpg" alt="午夜鸢尾"></a></figure><figure data-id="rose"><figcaption>靛蓝玫瑰</figcaption><a href="rose-overview.jpg"><img src="rose-overview.jpg" alt="靛蓝玫瑰"></a></figure><figure data-id="sand"><figcaption>岩棕砂金</figcaption><a href="sand-overview.jpg"><img src="sand-overview.jpg" alt="岩棕砂金"></a></figure><figure data-id="coral"><figcaption>暮夜珊瑚</figcaption><a href="coral-overview.jpg"><img src="coral-overview.jpg" alt="暮夜珊瑚"></a></figure></main><script>const select=document.getElementById('view');select.onchange=()=>{for(const figure of document.querySelectorAll('figure')){const src=figure.dataset.id+'-'+select.value+'.jpg';figure.querySelector('a').href=src;figure.querySelector('img').src=src}};</script></html>
